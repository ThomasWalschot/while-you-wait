<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>Phone Light</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      touch-action: none;
    }

    #screen {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #start {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      z-index: 10;
    }

    button {
      padding: 16px 22px;
      border: 1px solid #666;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font: 600 20px system-ui, sans-serif;
    }
  </style>
</head>

<body>

  <div id="screen"></div>

  <div id="start">
    <button>START PERFORMANCE</button>
  </div>

  <script src="app.js"></script>

</body>
</html>
